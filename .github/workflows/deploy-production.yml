name: Desplegar en produccion

# Se dispara cuando las comprobaciones TERMINAN en main, y solo despliega si han
# pasado. Antes escuchaba el push directamente, asi que despliegue y
# comprobaciones corrian en paralelo: el 26-sep-2026 se publico una version con
# el CI en rojo sin que nada lo impidiera.
on:
  workflow_run:
    workflows: ["Comprobaciones"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    name: real3d.io
    runs-on: ubuntu-latest
    # En un disparo manual no hay workflow_run que mirar, de ahi la segunda rama.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # El entorno "produccion" es el que exige aprobacion manual.
    # Settings -> Environments -> produccion -> Required reviewers.
    environment:
      name: produccion
      url: https://real3d.io

    steps:
      - name: Que se va a desplegar
        run: |
          echo "commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "comprobaciones: ${{ github.event.workflow_run.conclusion || 'lanzado a mano' }}"

      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar la version nueva
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "sudo -n /usr/local/bin/real3d-deploy.sh main"

      - name: Comprobar que la web responde
        run: |
          for url in https://real3d.io/ https://real3d.io/projects https://real3d.io/portal; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Version desplegada
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "basename \$(readlink -f /var/www/real3d/current)"
