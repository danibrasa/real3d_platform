name: Desplegar en staging

# Staging es un espejo de `main`, sin intervencion: cada pull request fusionado
# aparece aqui en cuanto pasan las comprobaciones. El equipo revisa siempre lo
# ultimo aprobado y nadie tiene que mover codigo de una rama a otra.
#
# Produccion NO sale de staging: sale del mismo `main`, cuando alguien lo aprueba
# a mano (ver deploy-production.yml). Es el mismo commit el que recorre los dos
# entornos, asi que lo que se valida aqui es exactamente lo que se publica.
on:
  workflow_run:
    workflows: ["Comprobaciones"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama a desplegar en staging (por defecto main)'
        required: false
        default: 'main'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  desplegar:
    name: staging.real3d.io
    runs-on: ubuntu-latest
    # Un disparo manual no trae workflow_run: ahi se despliega la rama pedida,
    # que es como se prueba un pull request sin fusionarlo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: staging

    steps:
      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "sudo -n /usr/local/bin/staging-deploy.sh ${{ github.event.inputs.rama || 'main' }}"
