name: Desplegar en staging

# Igual que produccion: espera a que las comprobaciones terminen en staging y
# solo despliega si han pasado. Staging es donde el equipo supervisa, asi que
# no debe recibir codigo que no compila o con los tests en rojo.
on:
  workflow_run:
    workflows: ["Comprobaciones"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama a desplegar en staging (por defecto staging)'
        required: false
        default: 'staging'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  desplegar:
    name: staging.real3d.io
    runs-on: ubuntu-latest
    # Un disparo manual no trae workflow_run: ahi se despliega la rama pedida,
    # que es justo como se prueba un pull request antes de fusionarlo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: staging

    steps:
      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "sudo -n /usr/local/bin/staging-deploy.sh ${{ github.event.inputs.rama || 'staging' }}"
