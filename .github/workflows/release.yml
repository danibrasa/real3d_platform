name: Publicar version

# Mantiene CHANGELOG.md y los tags a partir de los commits (Conventional Commits).
# No publica nada por su cuenta: abre un pull request con la version y el changelog
# ya calculados. Al fusionarlo crea el tag, igual que cualquier otro cambio aqui.
#
# Requiere que el repositorio permita a Actions abrir pull requests:
# Settings -> Actions -> General -> Workflow permissions.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # La configuracion va en release-please-config.json y en
      # .release-please-manifest.json; en la v4 el action solo acepta las rutas.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
