# Los ficheros del visor (modelo, fondo 360, video), servidos por nginx.
#
# PHP decide -- permiso, plan, cache -- y contesta con X-Accel-Redirect a
# /_ficheros/<ruta>; nginx lee el fichero de aqui con sendfile y rangos, sin
# que un proceso php-fpm lea 35 MB y los escriba. "internal": nadie puede
# pedir /_ficheros/... directamente, solo llegar por la redireccion de PHP.
#
# Se incluye dentro del bloque server del sitio:
#     include /etc/nginx/snippets/real3d-ficheros.conf;
# y la aplicacion necesita FICHEROS_POR_NGINX=true en su .env. El alias es la
# raiz del disco privado de Laravel (storage/app/private) de ESE sitio.
location /_ficheros/ {
    internal;
    alias __RAIZ__/storage/app/private/;
}
